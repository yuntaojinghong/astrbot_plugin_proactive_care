name: astrbot_plugin_proactive_care
display_name: 微光 · 主动关怀
desc: '让机器人学会先开口。群友一发消息就按可调概率接一句（即时搭话，可每个群单独设置），或者在群聊静默太久、话题断在半截时开口——微光会结合这个群真实聊过的内容与长期记忆，用你已配置的模型生成一句自然的话发出来，而不是群发模板。五种触发方式各自独立开关，另有静默时段、每日上限、冷却与「连续没回应自动闭嘴」四层防骚扰。所有数据存本地 SQLite，配套 Pages 面板可查看记忆、回溯每条主动消息的触发原因，并支持只生成不发送的预览。与匿名树洞类插件做了三重隔离，不会记录机器人自身转述的内容。'
short_desc: 群友发言时按概率接话，群聊静默久了也会主动开口，结合上下文与长期记忆说话，自带动效面板与四层防骚扰。
version: v1.1.0
author: yuntaojinghong
repo: https://github.com/yuntaojinghong/astrbot_plugin_proactive_care
astrbot_version: ">=4.24.2"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - wecom
  - dingtalk
