name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: 校验配置文件
        run: |
          python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8')); print('_conf_schema.json OK')"
          python -c "
          import re, pathlib
          text = pathlib.Path('metadata.yaml').read_text(encoding='utf-8')
          for key in ('name:', 'display_name:', 'version:', 'author:', 'repo:'):
              assert key in text, f'metadata.yaml 缺少 {key}'
          print('metadata.yaml OK')
          "

      - name: 校验版本号一致性（metadata.yaml / __init__.py）
        run: |
          python - <<'PY'
          import re, sys
          def grab(path, pattern):
              m = re.search(pattern, open(path, encoding="utf-8").read(), re.M)
              return m.group(1) if m else None
          got = {
              "metadata.yaml": grab("metadata.yaml", r"^version:\s*v?(\S+)\s*$"),
              "__init__.py": grab("__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
          }
          if None in got.values() or len(set(got.values())) != 1:
              print("版本号不一致（两处必须相同，改一处就要改另一处）:", got)
              sys.exit(1)
          print(f"版本号一致：v{got['metadata.yaml']}")
          PY

      - name: 编译检查
        run: python -m compileall -q main.py proactive web

      - name: 运行单元测试
        run: python -m pytest tests -q

      # 面板相关的两个 js 测试此前只躺在仓库里，CI 从没跑过 ——
      # 等于装了个不会响的警报器。style_regression 是这次「生效中」徽章
      # 错位的回归检查，必须真的被执行才有意义。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 面板样式与交互测试（node）
        run: |
          node tests/style_regression.test.js
          npm install --no-save --no-audit --no-fund jsdom
          node tests/panel_confirm.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: 代码风格检查
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .

      - name: 语法结构检查
        run: ruff check --select E9 .
