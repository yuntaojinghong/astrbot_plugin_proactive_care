name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: 校验配置文件
        run: |
          python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8')); print('_conf_schema.json OK')"
          python -c "
          import re, pathlib
          text = pathlib.Path('metadata.yaml').read_text(encoding='utf-8')
          for key in ('name:', 'display_name:', 'version:', 'author:', 'repo:'):
              assert key in text, f'metadata.yaml 缺少 {key}'
          print('metadata.yaml OK')
          "

      - name: 编译检查
        run: python -m compileall -q main.py proactive web

      - name: 运行单元测试
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff

      - name: 代码风格检查
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 .

      - name: 语法结构检查
        run: ruff check --select E9 .
